<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Currículo - João Gabriel</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./icon.png" type="image/x-icon">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
  </style>
  <!-- 
    Biblioteca para exportar PDF 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  -->
  </head>
<body>

  <div class="acoes" aria-label="Ações do currículo">
    <button id="btn-idioma" type="button">EN-EU</button>
    <button id="btn-pdf" type="button">Exportar para PDF</button>
  </div>

  <main id="curriculo">
    <section class="header">
      <img id="foto" src="./foto.png" alt="" />
      <div class="gap20">
        <h1 id="nome" class="opensansextrabold"></h1>
        <p id="info"></p>
      </div>
    </section>

    <section>
      <h2 class="opensansextrabold" data-secao="formacao"></h2>
      <div id="formacao"></div>
    </section>

    <section>
      <h2 class="opensansextrabold" data-secao="experiencia"></h2>
      <div id="experiencia"></div>
    </section>

    <section>
      <h2 class="opensansextrabold" data-secao="extracurricular"></h2>
      <div id="extra"></div>
    </section>

    <section class="secao-marcos">
      <h2 class="opensansextrabold" data-secao="marcos"></h2>
      <div id="marcos"></div>
    </section>

    <section>
      <h2 class="opensansextrabold" data-secao="habilidades"></h2>
      <div id="habilidades"></div>
    </section>
  </main>

  <script src="./dataBebel.js"></script>
  <script src="./script.js"></script>
</body>
</html>

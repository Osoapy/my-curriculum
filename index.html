<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Currículo - João Gabriel</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./icon.png" type="image/x-icon">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
  </style>
  <!-- Biblioteca para exportar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <button id="btn-pdf">Exportar para PDF</button>

  <main id="curriculo">
    <section class="header">
      <img id="foto" src="./outros/foto.png" />
      <div class="gap20">
        <h1 id="nome" class="opensansextrabold"></h1>
        <p id="info"></p>
      </div>
    </section>

    <section>
      <h2 class="opensansextrabold">Formação Acadêmica</h2>
      <ul id="formacao"></ul>
    </section>

    <section>
      <h2 class="opensansextrabold">Experiência Profissional</h2>
      <div id="experiencia"></div>
    </section>

    <section>
      <h2 class="opensansextrabold">Experiência Extracurricular</h2>
      <div id="extra"></div>
    </section>

    <section>
      <h2 class="opensansextrabold">Marcos Extracurriculares</h2>
      <ul id="marcos"></ul>
    </section>

    <section>
      <h2 class="opensansextrabold">Habilidades</h2>
      <ul id="habilidades"></ul>
    </section>
  </main>

  <script src="./dataBebel.js"></script>
  <script src="./script.js"></script>
</body>
</html>

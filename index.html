<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Currículo - João Gabriel</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/png" sizes="any" href="./assets/icon.png?v=2">
  <link rel="shortcut icon" type="image/png" href="./assets/icon.png?v=2">
  <link rel="apple-touch-icon" href="./assets/icon.png?v=2">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
  </style>
  </head>
<body>

  <div class="acoes" aria-label="Ações do currículo">
    <button id="btn-idioma" type="button">EN-EU</button>
    <button id="btn-pdf" type="button">Exportar para PDF</button>
  </div>

  <main id="curriculo">
    <article class="pagina">
      <section class="header">
        <img id="foto" src="./assets/foto.png" alt="" />
        <div class="gap20">
          <h1 id="nome" class="opensansextrabold"></h1>
          <p id="info"></p>
        </div>
      </section>

      <section>
        <h2 class="opensansextrabold" data-secao="formacao"></h2>
        <div id="formacao"></div>
      </section>

      <section>
        <h2 class="opensansextrabold" data-secao="links"></h2>
        <div id="links"></div>
      </section>

      <section>
        <h2 class="opensansextrabold" data-secao="experiencia"></h2>
        <div id="experiencia"></div>
      </section>
    </article>

    <article class="pagina">
      <section>
        <h2 class="opensansextrabold" data-secao="extracurricular"></h2>
        <div id="extra"></div>
      </section>

      <section>
        <h2 class="opensansextrabold" data-secao="marcosTecnicos"></h2>
        <div id="marcos-tecnicos"></div>
      </section>

      <section>
        <h2 class="opensansextrabold" data-secao="hardSkills"></h2>
        <div id="hard-skills"></div>
      </section>

      <section>
        <h2 class="opensansextrabold" data-secao="softSkills"></h2>
        <div id="soft-skills"></div>
      </section>
    </article>
  </main>

  <script src="./dataBebel.js"></script>
  <script src="./script.js"></script>
</body>
</html>
